[backend]
precision = double
rank-allocator = linear

[backend-openmp]
;cblas = Enter path to local BLAS library for OpenMP backend

[constants]
Nv = 32
NvBatchSize = 64
Nrho = 8

[non-dim]
T0 = 223
H0 = 30e-3
rho0 = 1.91607e-5
molarMass0 = 4.0047236985e-3

[velocity-mesh]
dev = 7
cmax = 0
Tmax = 223

[spherical-design-rule]
ssrule = womersley
M = 6

[scattering-model]
type = vhs-gll
omega = 0.5
dRef = 2.17e-10
Tref = 273

[solver]
system = dgfs
order = 2

[solver-time-integrator]
scheme = dgfs-euler
controller = none
tstart = 0.0
tend = 6.02
dt = 0.001

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.1

[solver-interfaces-line]
flux-pts = gauss-legendre-lobatto

[solver-elements-quad]
soln-pts = gauss-legendre-lobatto

[soln-plugin-nancheck]
nsteps = 5

[soln-plugin-dgfsresidualstd]
nsteps = 5
output-file = 1
file = kinetic_smoke_residual.csv

[soln-plugin-dgfskineticdiagnosticsstd]
nsteps = 5
file = kinetic_diagnostics.csv
cell-file = kinetic_cells.csv
modal-threshold = -3.0
negative-absolute-tolerance = 0.0
negative-relative-tolerance = 1e-10
negative-l1-tolerance = 1e-8
rho-floor = 1e-12
temperature-floor = 1e-12
entropy-floor = 1e-300
velocity-chunk = 256
distribution-modal-sensor = true

[soln-ics]
type = maxwellianExpr
rho = 1.91607e-5 + (3.50901370597e-05-1.91607e-5)*((x + 2.0)/4.0)
T = 223 + (355.348-223)*((x + 2.0)/4.0)
ux = 1398.77132391 + (763.598-1398.77132391)*((x + 2.0)/4.0)
uy = 0
uz = 0

[soln-bcs-left]
type = dgfs-inlet-normalshock
rho = 1.91607e-5
T = 223
ux = 1398.77132391
uy = 0
uz = 0

[soln-bcs-right]
type = dgfs-inlet-normalshock
rho = 3.50901370597e-05
T = 355.348
ux = 763.598
uy = 0
uz = 0
